# Invitation, password-reset and workflow-callback links carry a bearer token as a path segment. The image's default
# `main` access log writes the request line ($request) and the Referer, and a page opened at /invite/<token> sends that
# whole URL as the Referer of every asset it loads, so the token would land in the container log, readable by anyone who
# can read logs. These maps put `{token}` in place of that segment in the copy the log gets; every other request is
# logged exactly as `main` logs it. static-hosting.test.ts pins the routes, docker/e2e/run.sh the served log.
map $request_uri $codespace_logged_uri {
    "~*^(?<logged_uri_head>/(?:invite|reset-password|api/invitations|api/auth/reset-password|api/workflows/callbacks)/)[^/?]*(?<logged_uri_tail>.*)$" "${logged_uri_head}{token}${logged_uri_tail}";
    default $request_uri;
}

map $http_referer $codespace_logged_referer {
    "~*^(?<logged_referer_origin>[^/]*//[^/]*)(?<logged_referer_head>/(?:invite|reset-password|api/invitations|api/auth/reset-password|api/workflows/callbacks)/)[^/?]*(?<logged_referer_tail>.*)$" "${logged_referer_origin}${logged_referer_head}{token}${logged_referer_tail}";
    default $http_referer;
}

log_format codespace '$remote_addr - $remote_user [$time_local] "$request_method $codespace_logged_uri $server_protocol" '
                     '$status $body_bytes_sent "$codespace_logged_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    access_log  /var/log/nginx/access.log  codespace;

    # Sets $codespace_api_origin — the API origin the SPA was configured with ("" when same-origin). Written at
    # container start by docker/init.sh from the substituted env.js; nginx refuses to start without it. Under /tmp, not
    # /etc, so generating it needs nothing under /etc to be writable. That is the only write moved: the image does not yet
    # start with a read-only root filesystem (init.sh still substitutes dist/env.js in place and runs npx, which keeps a
    # cache under $HOME, and nginx writes its pid file and /var/cache/nginx).
    include /tmp/codespace/api-origin.conf;

    location / {
        root   /usr/share/nginx/html/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header 'Access-Control-Allow-Origin' '*' always;  # 允许所有来源
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Browser-side defenses for a page that renders untrusted markdown inside a signed-in session (an HttpOnly cookie,
        # or — where the API cannot confirm one — a bearer token in localStorage).
        # They sit here beside the CORS headers because nginx inherits add_header from an outer level only when a level
        # declares none of its own.
        #   script-src 'self'  no inline script, no eval — the runtime env is /env.js for exactly this reason.
        #   style-src          'unsafe-inline' because Base UI (Select, ScrollArea) renders <style> elements at runtime.
        #   img-src https: http:  README, PR and answer images come from hosts only known at runtime — a team's self-managed
        #                      provider, badge services, model-authored URLs — so no static host list can name them. http:
        #                      as well, because a self-managed GitLab or Gitea on a plain-HTTP deployment serves its avatars
        #                      and README images over http. img-src is not what protects the session: an image request cannot
        #                      read the response or the page, and https: already lets any host be asked for one, so cleartext
        #                      adds no new destination (script-src, connect-src and form-action are what hold the line).
        #   connect-src        the app itself and the API origin, nothing else.
        #   base-uri, form-action, frame-ancestors  do not fall back to default-src, so each is closed on its own. Every
        #                      form in the app submits through its onSubmit handler, never natively.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http: $codespace_api_origin; font-src 'self' data:; connect-src 'self' $codespace_api_origin; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        # A cross-origin request (image, link, fetch) carries only the app's origin, never the path, so no outside host
        # learns which repository or item was open. It is also the browsers' default; this pins it. The no-referrer on
        # outside images (MarkdownImage, prepareProviderHtml) withholds the origin too; it does not replace this.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($request_method = OPTIONS) {
          add_header 'Access-Control-Allow-Origin' '*' always;  # 允许所有来源
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;  # 允许的 HTTP 方法
          add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;  # 允许的请求头
          return 204;  # 返回204 No Content
        }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html/dist;
    }
}
