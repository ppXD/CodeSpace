server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Sets $codespace_api_origin — the API origin the SPA was configured with ("" when same-origin). Written at
    # container start by docker/init.sh from the substituted env.js; nginx refuses to start without it.
    include /etc/nginx/codespace/api-origin.conf;

    location / {
        root   /usr/share/nginx/html/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header 'Access-Control-Allow-Origin' '*' always;  # 允许所有来源
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Browser-side defenses for a page that renders untrusted markdown and keeps its session token in localStorage.
        # They sit here beside the CORS headers because nginx inherits add_header from an outer level only when a level
        # declares none of its own.
        #   script-src 'self'  no inline script, no eval — the runtime env is /env.js for exactly this reason.
        #   style-src          'unsafe-inline' because Base UI (Select, ScrollArea) renders <style> elements at runtime.
        #   img-src https:     README, PR and answer images come from hosts only known at runtime — a team's self-managed
        #                      provider, badge services, model-authored URLs — so no static host list can name them.
        #   connect-src        the app itself and the API origin, nothing else.
        #   base-uri, form-action, frame-ancestors  do not fall back to default-src, so each is closed on its own. Every
        #                      form in the app submits through its onSubmit handler, never natively.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: $codespace_api_origin; font-src 'self' data:; connect-src 'self' $codespace_api_origin; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        # A cross-origin request (image, link, fetch) carries only the app's origin, never the path, so no outside host
        # learns which repository or item was open. It is also the browsers' default; this pins it. The no-referrer on
        # outside images (MarkdownImage, prepareProviderHtml) withholds the origin too; it does not replace this.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($request_method = OPTIONS) {
          add_header 'Access-Control-Allow-Origin' '*' always;  # 允许所有来源
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;  # 允许的 HTTP 方法
          add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;  # 允许的请求头
          return 204;  # 返回204 No Content
        }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html/dist;
    }
}
