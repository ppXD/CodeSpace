name: Sandbox · Isolation E2E

# The OS-isolation crown jewel — the ONLY suite that cannot run on a macOS dev host. It drives the
# REAL durable launch (setsid + sh supervisor + bubblewrap + prlimit + spool) against real binaries
# and asserts REAL kernel confinement: an operator secret outside the binds is invisible, egress is
# severed when the network is disallowed, and RLIMIT_NPROC / RLIMIT_FSIZE caps reach the agent.
#
# Runs in a PRIVILEGED container so unprivileged user namespaces work regardless of the host runner's
# AppArmor policy — exactly the `docker run --privileged dotnet/sdk:10.0 + apt install bubblewrap`
# environment these tests were validated against locally.
#
# Sandbox__RequireConfinement=true is the fail-closed guarantee: if bubblewrap / userns is NOT working,
# the tests do NOT silently skip — their gate asserts IsRequired==false and so fails HARD. Green here
# therefore means "confinement was actually exercised", never "the environment couldn't sandbox".

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/sandbox-isolation.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/sandbox-isolation.yml'
  workflow_dispatch:

concurrency:
  group: sandbox-isolation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The DI container fail-fasts without a Variables master key outside Development (the settings arc's
  # guard). Same committed local-dev test key docker-compose.yml carries — a committed value, not a toggle.
  CODESPACE_VARIABLE_MASTER_KEY: 'bG9jYWwtZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZCE='
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  isolation:
    name: bubblewrap + prlimit confinement (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      options: --privileged

    env:
      # Fail-closed: a degraded sandbox (no bwrap / no userns) becomes a HARD test failure, so
      # confinement can never silently no-op into a green run.
      Sandbox__RequireConfinement: 'true'
      # Same fail-closed contract for the cgroup-v2 resource cap (B4): if the privileged container can't delegate
      # cgroups, the cgroup E2E FAILS HARD instead of skipping — a real cap was exercised, never "couldn't, so green".
      CODESPACE_REQUIRE_CGROUP: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Install confinement tools, Python, and Git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bubblewrap util-linux ca-certificates iproute2 nftables curl python3 git
          echo "bwrap: $(bwrap --version)"
          echo "prlimit: $(prlimit --version)"
          echo "ip: $(ip -Version)"
          echo "nft: $(nft --version)"
          echo "python3: $(python3 --version)"
          echo "git: $(git --version)"
          echo "cgroup: $(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo 'no cgroup-v2 controllers visible')"

      - name: Probe — unprivileged user namespaces (informational)
        # Informational only: the authoritative gate is the test step below (REQUIRE_SANDBOX=1 → hard
        # fail if confinement is unavailable). This just surfaces a clear "userns works/doesn't" signal
        # early without ever failing the job on a bwrap-flag quirk.
        run: |
          if bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --uid 0 true; then
            echo "✓ unprivileged user namespaces work"
          else
            echo "⚠ userns probe failed — the REQUIRE_SANDBOX=1 test step is authoritative and will fail hard if confinement is truly unavailable"
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: /root/.nuget/packages
          key: nuget-sandbox-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-sandbox-

      - name: Restore
        run: dotnet restore backend/tests/CodeSpace.SandboxTests/CodeSpace.SandboxTests.csproj

      - name: Test (real bwrap / prlimit confinement)
        run: >
          dotnet test backend/tests/CodeSpace.SandboxTests/CodeSpace.SandboxTests.csproj
          --no-restore
          --filter "Category=Sandbox"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=sandbox.trx"
          --results-directory backend/TestResults

      - name: Assert the isolation tests actually ran (no silent skip)
        # `dotnet test --filter` EXITS 0 even when the filter matches ZERO tests, so a trait regression
        # could make this job pass green while exercising nothing. Read the trx counters and require the
        # 4 known confinement tests to have executed. (REQUIRE_SANDBOX=1 already turns a "ran but couldn't
        # sandbox" degrade into a hard failure; this closes the complementary "matched nothing" hole.)
        run: |
          trx=backend/TestResults/sandbox.trx
          test -f "$trx" || { echo "::error::trx not found at $trx — the test step produced no results"; exit 1; }
          executed=$(grep -oE 'executed="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+')
          passed=$(grep -oE 'passed="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+')
          echo "executed=${executed:-0} passed=${passed:-0}"
          if [ "${executed:-0}" -lt 12 ]; then
            echo "::error::Expected >=12 sandbox isolation tests to run (bwrap/prlimit confinement + cap-drop + cgroup-namespace re-root + egress-allowlist filter + cgroup resource cap + durable-launch cgroup wiring), but only ${executed:-0} did — the Category=Sandbox filter matched too few (trait regression?)."
            exit 1
          fi

      - name: Assert batch and stream kernel coverage passed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('backend/TestResults/sandbox.trx').getroot()
          results = root.findall('.//{*}UnitTestResult')
          methods = (
              'Commands_can_write_their_workspace_but_cannot_read_other_workspaces_or_write_system_roots',
              'Network_denial_blocks_a_real_host_listener_and_explicit_network_access_can_reach_it',
              'File_size_caps_reach_the_real_command',
              'Memory_caps_are_enforced_classified_from_the_kernel_and_reclaimed',
          )
          for method in methods:
              cases = [r for r in results if 'CommandIsolationE2ETests.' + method + '(' in r.get('testName', '')]
              assert len(cases) == 2 and all(r.get('outcome') == 'Passed' for r in cases), f'{method}: both batch and stream must pass, skips are not evidence'
          print('All 8 batch/stream kernel cases passed.')
          PY

      - name: Assert every Git workspace confinement path passed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          results = ET.parse('backend/TestResults/sandbox.trx').getroot().findall('.//{*}UnitTestResult')
          methods = (
              'Network_clone_pin_fetch_capture_and_authenticated_push_match_the_real_remote',
              'Pack_clone_uses_only_its_destination_and_reclaims_it',
              'Branch_integration_clones_applies_and_pushes_the_exact_patch',
              'Acceptance_patch_clone_runs_the_real_oracle_on_the_applied_base',
              'Explicit_local_source_is_read_only_and_siblings_stay_invisible',
          )
          for method in methods:
              cases = [r for r in results if r.get('testName', '').endswith('GitWorkspaceIsolationE2ETests.' + method)]
              assert len(cases) == 1 and cases[0].get('outcome') == 'Passed', f'{method}: the actual Git confinement case must pass, skips are not evidence'
          print('All 5 Git workspace confinement cases passed.')
          survival = [r for r in results if 'GitWorkspaceIsolationE2ETests.A_command_survives_its_managed_launch_thread_while_the_worker_process_is_alive(' in r.get('testName', '')]
          assert len(survival) == 2 and all(r.get('outcome') == 'Passed' for r in survival), 'Both command modes must survive managed launch thread retirement'
          death = [r for r in results if r.get('testName', '').endswith('GitWorkspaceIsolationE2ETests.Killing_the_worker_process_still_terminates_its_confined_command')]
          assert len(death) == 1 and death[0].get('outcome') == 'Passed', 'Worker process death must still terminate the real sandbox'
          print('All 3 worker/thread lifetime cases passed.')
          for method in ('Bounded_capture_preserves_confinement_and_exit_receipts_while_draining_overflow', 'Bounded_capture_keeps_kernel_oom_classification_and_reclaims_its_cgroup'):
              cases = [r for r in results if 'BoundedCommandCaptureE2ETests.' + method + '(' in r.get('testName', '')]
              assert len(cases) == 2 and all(r.get('outcome') == 'Passed' for r in cases), f'{method}: both batch and streaming kernel cases must pass, skips are not evidence'
          print('All 4 bounded command capture kernel cases passed.')
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-isolation-trx
          path: backend/TestResults/*.trx
          if-no-files-found: ignore
