name: Frontend · Lint · Typecheck · Vitest

# The frontend verify trio: ESLint, the tsc -b + vite build typecheck/bundle, and the vitest unit
# suite. pnpm is the package manager (pnpm-lock.yaml is the authoritative lockfile).
#
# Beside it, the SPA image job builds frontend/Dockerfile and starts it the way the cluster does, proving over
# HTTP that nginx serves the CSP with the API origin init.sh derives from the runtime env. It runs on every
# frontend change: the image is built from all of frontend/, so no narrower path list would cover what breaks it.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: pnpm lint + build + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck + build
        run: pnpm run build

      - name: Unit tests (vitest)
        run: pnpm run test
        env:
          VITE_API_URL: http://localhost:5099

  spa-image:
    name: SPA image serves its CSP (real nginx + init.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # node reads the served /env.js the way the browser runs it; docker and curl ship on ubuntu-latest.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SPA image E2E
        run: frontend/docker/e2e/run.sh
