# Local dev stack. Spins up the dependencies CodeSpace needs so `dotnet run` and
# `pnpm dev` work without any extra setup.
#
#   docker compose up -d            # start everything in the background
#   docker compose down             # stop containers, preserve data
#   docker compose down -v          # nuke the volume too (fresh DB)
#
# Credentials below intentionally match backend/src/CodeSpace.Api/appsettings.json —
# the API connects with codespace/codespace/codespace out of the box. Rotate via env
# vars in any non-local environment.

services:
  postgres:
    image: postgres:18-alpine
    container_name: codespace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codespace
      POSTGRES_PASSWORD: codespace
      POSTGRES_DB: codespace
      # Also create a postgres superuser so the integration test fixture
      # (TestPostgres:AdminConnectionString) can spin up disposable per-test DBs.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # PG18+ uses major-version-specific data layout; pin PGDATA to a subdirectory of the
      # mount so the volume-mount semantics we want (single named volume → all data) stay
      # intact while satisfying PG18's check that data isn't at /var/lib/postgresql/data
      # directly. See docker-library/postgres#37.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - codespace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codespace -d codespace"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The CodeSpace app, split into TWO deployments off TWO images that mirror the production topology — the public
  # HTTP frontend and the local sandbox runner are different security/scaling concerns, so they are different
  # images (backend/Dockerfile.api + backend/Dockerfile.worker). Both run the SAME CodeSpace.Api.dll; the ROLE is
  # selected by the HangfireHosting setting (Api | Worker), read through the normal configuration pipeline. Both are behind the "app" profile so the default local-dev
  # flow stays "compose up Postgres + `dotnet run`"; run the full containerised stack with
  # `docker compose --profile app up`. In k8s these become two Deployments that scale (replica) independently.

  # PUBLIC API — serves HTTP + enqueues, processes NO jobs (HangfireHosting=Api → no Hangfire server). It executes no agent and hosts no MCP endpoint, so it carries none of the agent-execution /
  # isolation deps (lean, internet-facing → small attack surface). Built from the minimal Dockerfile.api.
  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: codespace-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5099:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      CodeSpaceStore__ConnectionString: "Host=postgres;Port=5432;Database=codespace;Username=codespace;Password=codespace"
      # Blank turns Seq off, which is what a container gets by default: appsettings points at
      # localhost:5341, and inside a container that is the container itself. Point it at a reachable
      # Seq (host.docker.internal, or a service you add) to search these logs afterwards.
      Serilog__Seq__ServerUrl: "${SEQ_SERVER_URL:-}"
      # This pod NEVER processes jobs — it serves HTTP + enqueues only. Agent execution lives in the worker.
      HangfireHosting: "Api"
      # ASPNETCORE_ENVIRONMENT=Production above means the variable-encryption master key is REQUIRED (Development is
      # the only environment with a fallback), so without these two the pod throws at container build and crash-loops.
      # The values are LOCAL-ONLY and labelled as such; override both in anything an operator would call a deployment.
      CODESPACE_VARIABLE_MASTER_KEY: "${CODESPACE_VARIABLE_MASTER_KEY:-bG9jYWwtZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZCE=}"
      # Stated explicitly rather than inheriting appsettings.json's committed dev key — a Production-labelled pod
      # silently signing tokens with a source-controlled key is exactly the footgun this line makes visible.
      Authentication__Jwt__SymmetricKey: "${CODESPACE_JWT_SYMMETRIC_KEY:-local-dev-only-jwt-key-minimum-32-chars-long}"

  # WORKER = THE LOCAL SANDBOX RUNNER — the Hangfire PROCESSING pod (HangfireHosting=Worker, which is also the
  # default when the key is absent). Agent runs + the per-run MCP endpoint execute HERE; the harness CLI is spawned as a confined child
  # by LocalProcessRunner. Built from Dockerfile.worker, which carries git + bubblewrap + util-linux (prlimit) +
  # the codespace-mcp proxy. The MCP endpoint + tool governance are turned ON here; code defaults stay fail-closed
  # default-OFF (a deployment that does not set these is byte-identical to today). Every flag is ${VAR:-default}.
  #
  # SAFETY: read-only tools are served UNCONDITIONALLY (McpRequestHandler short-circuits IsReadOnly BEFORE the
  # governance ledger); side-effecting tools route through the exactly-once ToolCallLedger + AgentToolGate matrix
  # (fail-closed). CONFINEMENT: bubblewrap is in the image, but Sandbox:RequireConfinement is NOT armed here — running
  # bubblewrap inside an unprivileged container needs userns/privileged settings, so a prod k8s pod that grants
  # user namespaces sets Sandbox__RequireConfinement=true (fail-closed); local dev runs agents unconfined-in-container.
  worker:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: codespace-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5100:8080"   # the Hangfire dashboard (/hangfire) + internal HTTP; the PUBLIC surface is the api service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      CodeSpaceStore__ConnectionString: "Host=postgres;Port=5432;Database=codespace;Username=codespace;Password=codespace"
      # Blank turns Seq off, which is what a container gets by default: appsettings points at
      # localhost:5341, and inside a container that is the container itself. Point it at a reachable
      # Seq (host.docker.internal, or a service you add) to search these logs afterwards.
      Serilog__Seq__ServerUrl: "${SEQ_SERVER_URL:-}"
      # This pod IS the worker — it executes agent runs + the per-run MCP endpoint. Stated explicitly rather than
      # relying on the default, so the topology is readable from the compose file alone.
      HangfireHosting: "Worker"
      # Both pods share ONE key-ring and ONE token signer, so these MUST match the api service's values above.
      CODESPACE_VARIABLE_MASTER_KEY: "${CODESPACE_VARIABLE_MASTER_KEY:-bG9jYWwtZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZCE=}"
      Authentication__Jwt__SymmetricKey: "${CODESPACE_JWT_SYMMETRIC_KEY:-local-dev-only-jwt-key-minimum-32-chars-long}"
      # The full tool fabric and its governance used to be turned on here. Both are committed constants now
      # (AgentRunExecutor.FullToolCatalogByDefault, McpRequestHandler.GovernanceEnabled) at exactly the values this
      # file set, so every deployment gets the posture this one had rather than whatever its env happened to say.
      # The codespace-mcp proxy is published next to the API by the csproj target, so the default path resolves;
      # set this only to point at an air-gapped mirror or a custom location.
      CODESPACE_MCP_PROXY_PATH: "${CODESPACE_MCP_PROXY_PATH:-}"
      # Prod (userns-capable pod) arms the fail-closed isolation guard; left off for local dev (see comment above).
      # Sandbox__RequireConfinement: "true"

volumes:
  codespace-pgdata:
